<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="title desc">
  <title id="title">Separate processes, separate tenant contexts</title>
  <desc id="desc">An Acme gateway process uses tenant-acme and an Acme-scoped token. A separate Globex gateway uses tenant-globex and a Globex-scoped token. Both can reach the same backend services, which must validate each token and tenant and scope every data query. Tool arguments cannot switch either process's tenant.</desc>
  <defs>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#83dcc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#c3bbef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1120" height="408" rx="24" fill="#101b32"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="57" fill="#f0f5ff" font-size="28" font-weight="700">One process per tenant. No tenant switching in tool arguments.</text>

    <rect x="48" y="94" width="520" height="106" rx="16" fill="#15343c" stroke="#83dcc8"/>
    <text x="72" y="133" fill="#f0f5ff" font-size="22" font-weight="600">Acme gateway process</text>
    <text x="72" y="170" fill="#83dcc8" font-size="17">tenant-acme + Acme-scoped token</text>
    <path d="M568 147H765" stroke="#83dcc8" stroke-width="2" marker-end="url(#green-arrow)"/>
    <text x="667" y="132" text-anchor="middle" fill="#83dcc8" font-size="14">Fixed headers</text>

    <rect x="48" y="230" width="520" height="106" rx="16" fill="#26243d" stroke="#a99fda"/>
    <text x="72" y="269" fill="#f0f5ff" font-size="22" font-weight="600">Globex gateway process</text>
    <text x="72" y="306" fill="#c3bbef" font-size="17">tenant-globex + Globex-scoped token</text>
    <path d="M568 283H765" stroke="#c3bbef" stroke-width="2" marker-end="url(#purple-arrow)"/>
    <text x="667" y="268" text-anchor="middle" fill="#c3bbef" font-size="14">Fixed headers</text>

    <rect x="770" y="94" width="302" height="242" rx="16" fill="#18243b" stroke="#526887"/>
    <text x="796" y="133" fill="#a9bde0" font-size="13" font-weight="700" letter-spacing="1.3">SHARED BACKEND SERVICES</text>
    <text x="796" y="178" fill="#f0f5ff" font-size="26" font-weight="600">Billing / CRM</text>
    <path d="M796 202H1046" stroke="#344765"/>
    <text x="796" y="239" fill="#d2deee" font-size="17">Validate token + tenant</text>
    <text x="796" y="275" fill="#d2deee" font-size="17">Scope every data query</text>
    <text x="796" y="311" fill="#a9bde0" font-size="14">Backend authorization is mandatory</text>

    <text x="48" y="379" fill="#b6c5dc" font-size="16">A client configured with both gateways can access both tenants. Give each user only the access they need.</text>
  </g>
</svg>
