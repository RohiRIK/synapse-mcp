<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Synapse MCP: one gateway, multiple MCP services</title>
  <desc id="desc">Claude Desktop or Cursor connects to a tenant-scoped Synapse gateway over stdio. The gateway routes namespaced tool calls to billing and CRM services over SSE and HTTP, adding a fixed bearer token and tenant header.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gateway" x2="1" y2="1">
      <stop stop-color="#153c43"/>
      <stop offset="1" stop-color="#182b40"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#83dcc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1120" height="480" rx="24" fill="url(#background)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="48" y="42" width="40" height="40" rx="12" fill="#83dcc8"/>
    <path d="M58 69 68 55 78 69M61 65H75" fill="none" stroke="#102c35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="75" fill="#f0f5ff" font-size="36" font-weight="700">Synapse MCP</text>
    <text x="48" y="115" fill="#b6c5dc" font-size="20">One connection for your AI client. One tenant context for every tool call.</text>

    <rect x="48" y="172" width="250" height="192" rx="18" fill="#18243b" stroke="#344765"/>
    <text x="72" y="209" fill="#a9bde0" font-size="13" font-weight="700" letter-spacing="1.5">YOUR AI CLIENT</text>
    <text x="72" y="252" fill="#f0f5ff" font-size="24" font-weight="600">Claude Desktop</text>
    <text x="72" y="283" fill="#f0f5ff" font-size="24" font-weight="600">or Cursor</text>
    <text x="72" y="332" fill="#b6c5dc" font-size="16">Sees one combined tool list</text>

    <path d="M298 268H365" fill="none" stroke="#83dcc8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="333" y="247" text-anchor="middle" fill="#b6c5dc" font-size="14">stdio</text>

    <rect x="370" y="151" width="340" height="234" rx="18" fill="url(#gateway)" stroke="#83dcc8" stroke-width="1.5"/>
    <text x="396" y="189" fill="#83dcc8" font-size="13" font-weight="700" letter-spacing="1.5">TENANT-SCOPED GATEWAY</text>
    <text x="396" y="229" fill="#f0f5ff" font-size="28" font-weight="600">Discover. Name. Route.</text>
    <text x="396" y="267" fill="#d2e6ec" font-size="16">billing__create_invoice</text>
    <text x="396" y="294" fill="#d2e6ec" font-size="16">crm__get_user</text>
    <path d="M396 316H684" stroke="#3d5b64"/>
    <text x="396" y="348" fill="#83dcc8" font-size="16" font-weight="600">Identity comes from the environment</text>

    <path d="M710 268H751V208H805M751 268V332H805" fill="none" stroke="#83dcc8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M788 208H805" stroke="#83dcc8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="944" y="153" text-anchor="middle" fill="#b6c5dc" font-size="14">SSE GET + HTTP POST</text>

    <rect x="810" y="173" width="262" height="96" rx="16" fill="#20253e" stroke="#6c64a3"/>
    <text x="834" y="212" fill="#eeeaff" font-size="24" font-weight="600">Billing</text>
    <text x="834" y="244" fill="#c3bbef" font-size="16">create_invoice</text>
    <rect x="810" y="290" width="262" height="96" rx="16" fill="#20253e" stroke="#6c64a3"/>
    <text x="834" y="329" fill="#eeeaff" font-size="24" font-weight="600">CRM</text>
    <text x="834" y="361" fill="#c3bbef" font-size="16">get_user</text>

    <circle cx="55" cy="433" r="5" fill="#83dcc8"/>
    <text x="72" y="439" fill="#b6c5dc" font-size="16">Fixed auth headers</text>
    <circle cx="341" cy="433" r="5" fill="#83dcc8"/>
    <text x="358" y="439" fill="#b6c5dc" font-size="16">Namespaced tools</text>
    <circle cx="633" cy="433" r="5" fill="#83dcc8"/>
    <text x="650" y="439" fill="#b6c5dc" font-size="16">Healthy services stay available</text>
  </g>
</svg>
